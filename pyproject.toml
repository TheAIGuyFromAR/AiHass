[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aihass"
version = "0.1.0"
description = "AI-native bridge for Home Assistant — MCP server, REST API, and time-series database"
readme = "aihass/ARCHITECTURE.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    # Home Assistant communication
    "aiohttp>=3.9,<4",

    # MCP server (for Claude, Cursor, Conductor)
    "mcp>=1.0,<2",

    # REST API
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "sse-starlette>=2.0,<3",

    # Database
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",

    # Config
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.28",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
aihass = "aihass.__main__:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
